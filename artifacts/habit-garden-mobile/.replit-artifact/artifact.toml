kind = "mobile"
previewPath = "/mobile/"
title = "Habit Garden Mobile"
description = "A calm local-first Android companion for Habit Garden. Track daily habits, celebrate streaks, review weekly progress, and manage personal data privately on-device."
version = "1.0.0"
id = "artifacts/habit-garden-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/mobile/" ]
localPort = 20226

[services.development]
run = "pnpm --filter @workspace/habit-garden-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/habit-garden-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/habit-garden-mobile", "run", "serve" ]

[services.env]
PORT = "20226"
BASE_PATH = "/mobile/"
